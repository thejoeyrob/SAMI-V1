<style>
:root{--g:#63ff9d;--g2:#23d98f;--c:#50e6db;--ink:#f2faf6;--mut:#89a096;--bg:#020504}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.film{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 54%,#0a1712 0,#030706 42%,#000 100%)}.film:before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle at 50% 52%,rgba(71,255,143,.1),transparent 29%),radial-gradient(circle at 22% 78%,rgba(67,227,218,.035),transparent 28%);filter:blur(40px);animation:haze 13s ease-in-out infinite alternate;pointer-events:none}@keyframes haze{to{transform:translate3d(4%,-2%,0) scale(1.07)}}

.copy-stage{position:absolute;inset:0;display:grid;place-items:center;z-index:24;pointer-events:none}.hero-copy{width:min(92vw,1100px);padding:0 4vw;text-align:center;font-size:clamp(27px,5.2vmin,74px);line-height:1.01;font-weight:820;letter-spacing:.055em;text-transform:uppercase;text-wrap:balance;opacity:0;transform:translateY(14px) scale(.985);transition:opacity .55s,transform .7s cubic-bezier(.2,.8,.2,1);text-shadow:0 0 32px rgba(76,255,154,.08)}.hero-copy.show{opacity:1;transform:none}.hero-copy .sami-letter{display:inline-block;color:#8affb6;text-shadow:0 0 10px #8affb6,0 0 28px #4eff94;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .55s}.hero-copy.final{font-size:clamp(29px,6.1vmin,82px)}

.close-mode .skip,.close-mode .sound{display:none}.close-mode .final-brand{opacity:1;pointer-events:none}.close-mode .start{display:none}.close-mode .film:after{content:"";position:absolute;inset:0;background:#000;opacity:0;z-index:80;animation:closeFade 2.7s forwards}@keyframes closeFade{0%{opacity:0}55%{opacity:.08}100%{opacity:1}}
@media(max-width:650px){.tagline{font-size:8px;letter-spacing:.16em}.brand-stack{width:min(88vw,540px)}.matrix-word{font-size:clamp(7px,2vw,11px)}.hero-copy{width:94vw;padding:0 3vw;font-size:clamp(25px,6.4vmin,56px)}}
@media(orientation:portrait){.hero-copy{font-size:clamp(25px,7vmin,58px);line-height:1.04}.final-brand .brand-stack{width:88vw}.tagline{white-space:normal;max-width:88vw;line-height:1.5}.matrix-word{max-width:42vw;overflow:hidden;text-overflow:clip}}

<body>

</main>
<script>
(()=>{
'use strict';
const q=new URLSearchParams(location.search),embedded=q.get('embedded')==='1',closing=q.get('closing')==='1';
const $=id=>document.getElementById(id),film=$('film'),matrix=$('matrix'),words=$('words'),network=$('network'),nctx=network.getContext('2d'),cad=$('cadPlane'),cctx=cad.getContext('2d'),core=$('centreCore'),breaker=$('breaker'),hero=$('heroCopy'),pinStage=$('pinStage'),pin=$('pin'),impact=$('impact'),brand=$('finalBrand'),wordmark=$('wordmark'),bed=$('bed'),start=$('startPlanning'),skip=$('skip'),sound=$('sound');
const PROCESS=['SITE VISIT','PHOTOGRAPHS','NOTES','SERVICE INFORMATION','UTILITY PLANS','MEASUREMENTS','ON-SITE VERIFICATION','INTERNAL COMMUNICATION','EXTERNAL COMMUNICATION','DRAFT INFORMATION','CAD','REVIEW','AMENDMENT','RE-REVIEW','APPROVAL','PROJECT CHANGE','KEEPING EVERYONE UPDATED','TIME','COST','TRAVEL','DUPLICATION','ENVIRONMENTAL IMPACT','ACCESS','ROUTE TO SITE','CLIENT CHANGES','SURVEY','DRAWING ISSUE','REVISION','SIGN-OFF'];
const LINES=['WHAT IF ALL OF THAT COULD BECOME SIMPLER?','ONE SOURCE OF INFORMATION','ONE TEAM','ONE TOOL','IT’S TIME TO WORK SMARTER','IT’S TIME TO ASK SAMI'];
let timers=[],raf=0,soundOn=false,networkStart=0,cadStart=0;
const at=(ms,fn)=>timers.push(setTimeout(fn,ms)),clear=()=>{timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf)};
function resize(){for(const [cv,ctx] of [[network,nctx],[cad,cctx]]){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0)}}
function rand(seed){const x=Math.sin(seed*999.91+17.7)*43758.5453;return x-Math.floor(x)}
function fillMatrix(){words.innerHTML='';const count=Math.max(58,Math.min(126,Math.round(innerWidth*innerHeight/11500)));for(let i=0;i<count;i++){const el=document.createElement('div'),binary=i%5===0,text=binary?Array.from({length:9+i%8},(_,j)=>rand(i*31+j)>.5?'1':'0').join(''):PROCESS[i%PROCESS.length];el.className='matrix-word'+(binary?' binary':'')+(i%17===0?' hot':'');el.textContent=text;let x=3+rand(i*7+1)*91,y=4+rand(i*11+9)*89;if(Math.abs(x-50)<9&&Math.abs(y-50)<8){x=x<50?x-10:x+10}el.style.left=x+'%';el.style.top=y+'%';el.style.animationDelay=(i*.075)+'s,'+(rand(i+4)*1.8)+'s';el.style.fontSize=binary?'':(8+rand(i+2)*6)+'px';words.appendChild(el)}}
function networkFrame(now){const r=network.getBoundingClientRect(),w=r.width,h=r.height,cx=w/2,cy=h/2,t=(now-networkStart)/1000;nctx.clearRect(0,0,w,h);const branches=46;for(let i=0;i<branches;i++){const a=(i/branches)*Math.PI*2+(i%3)*.018;const len=(.13+.33*rand(i+2))*Math.min(w,h)*(1+Math.min(1,t/4)*.25);const ex=cx+Math.cos(a)*len*(w>h?1.42:1.04),ey=cy+Math.sin(a)*len*(h>w?1.24:.55);const mx=cx+(ex-cx)*(.33+.25*rand(i+8)),my=cy+(ey-cy)*(.33+.25*rand(i+12));nctx.globalAlpha=.10+.28*(.5+.5*Math.sin(t*4+i));nctx.strokeStyle=i%5===0?'#86ffb1':'#2bd98c';nctx.lineWidth=i%7===0?1.25:.65;nctx.beginPath();nctx.moveTo(cx,cy);if(i%2){nctx.lineTo(mx,cy+(my-cy)*.2);nctx.lineTo(mx,my);nctx.lineTo(ex,my);nctx.lineTo(ex,ey)}else{nctx.lineTo(cx+(mx-cx)*.25,my);nctx.lineTo(mx,my);nctx.lineTo(mx,ey);nctx.lineTo(ex,ey)}nctx.stroke();if(i%4===0){nctx.fillStyle='#88ffb5';nctx.globalAlpha=.25;nctx.fillRect(ex-1,ey-1,2,2)}}nctx.globalAlpha=.32;nctx.strokeStyle='#73ffad';for(let k=0;k<6;k++){nctx.beginPath();nctx.arc(cx,cy,18+k*13+(Math.sin(t*1.6+k)*2),0,Math.PI*2);nctx.stroke()}raf=requestAnimationFrame(networkFrame)}
function overload(){matrix.classList.add('overload');core.classList.add('overload');[...words.children].forEach((e,i)=>{if(i%3===0)e.classList.add('hot')});at(680,()=>{breaker.classList.add('fire');[...words.children].forEach(e=>e.classList.add('broken'));matrix.classList.add('dead');cancelAnimationFrame(raf)})}
function copy(text,final=false){hero.className='hero-copy'+(final?' final':'');hero.innerHTML='';if(final){const before='IT’S TIME TO ASK ';hero.append(document.createTextNode(before));'SAMI'.split('').forEach(ch=>{const s=document.createElement('span');s.className='sami-letter';s.textContent=ch;hero.appendChild(s)})}else hero.textContent=text;requestAnimationFrame(()=>hero.classList.add('show'))}
function hideCopy(){hero.classList.remove('show')}
function flyLetters(){const letters=[...hero.querySelectorAll('.sami-letter')];if(!letters.length)return;const rects=letters.map(x=>x.getBoundingClientRect());letters.forEach(x=>x.style.opacity='0');const targetX=innerWidth/2,targetY=innerHeight/2;rects.forEach((r,i)=>{const f=document.createElement('div');f.className='letter-flyer';f.textContent='SAMI'[i];f.style.left=r.left+'px';f.style.top=r.top+'px';film.appendChild(f);const spread=[-1.35,-.4,.4,1.25][i]*Math.min(innerWidth*.07,72);requestAnimationFrame(()=>{f.style.transform=`translate(${targetX-r.left+spread}px,${targetY-r.top-r.height/2}px) scale(.72)`});at(1180,()=>f.remove())});at(420,()=>hideCopy())}
function cadFrame(now){const r=cad.getBoundingClientRect(),w=r.width,h=r.height,cx=w/2,cy=h/2,t=(now-cadStart)/1000;cctx.clearRect(0,0,w,h);const grow=Math.min(1,t/1.85),retract=t<3?1:Math.max(0,1-(t-3)/.9),f=grow*retract;const scale=.16+.84*f;cctx.save();cctx.translate(cx,cy);cctx.scale(scale,scale*.36);cctx.lineCap='square';for(let i=0;i<34;i++){const a=(i/34)*Math.PI*2+rand(i+9)*.08,rad=(.13+.42*rand(i+3))*Math.min(w,h);const x=Math.cos(a)*rad,y=Math.sin(a)*rad;cctx.globalAlpha=.18+.48*f;cctx.strokeStyle=i%5===0?'#b5ffd0':'#3bea8d';cctx.lineWidth=(i%6===0?1.7:.8)/Math.max(.4,scale);cctx.beginPath();cctx.moveTo(0,0);const bendX=x*(.3+.28*rand(i+5)),bendY=y*(.3+.25*rand(i+12));cctx.lineTo(bendX,0);cctx.lineTo(bendX,bendY);cctx.lineTo(x,bendY);cctx.lineTo(x,y);cctx.stroke();if(i%4===0){cctx.globalAlpha=.14*f;cctx.strokeRect(x-18,y-11,36,22)}}cctx.restore();if(t<4.15)raf=requestAnimationFrame(cadFrame)}
function pinSequence(){pinStage.classList.add('on');matrix.style.opacity='0';hero.style.opacity='0';pin.classList.add('drop');at(830,()=>{impact.classList.add('fire');cadStart=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(cadFrame)});at(1160,()=>pin.classList.add('hover'));at(4120,()=>moveToLogo())}
function moveToLogo(){brand.classList.add('on');brand.style.opacity='0';start.style.opacity='0';const wr=wordmark.getBoundingClientRect();const targetX=wr.left+wr.width*.41,targetY=wr.top+wr.height*.665;pin.classList.remove('hover');pin.classList.add('to-logo');pin.style.left=targetX+'px';pin.style.top=targetY+'px';pin.style.transform='translate(-50%,-50%) scale(.31)';at(650,()=>{brand.style.opacity='1'});at(1050,()=>{pin.style.opacity='0';start.style.opacity='1';pinStage.style.opacity='0'})}
function finish(){clear();matrix.style.opacity='0';hero.style.opacity='0';pinStage.style.opacity='0';brand.classList.add('on');brand.style.opacity='1'}
function enter(){if(embedded&&parent!==window){parent.postMessage({type:'sami:sales-intro-done'},location.origin);return}location.href='./index.html?from=meet'}
function run(){clear();film.classList.remove('close-mode');matrix.className='matrix';matrix.style.opacity='1';core.className='centre-core';breaker.className='breaker';hero.className='hero-copy';hero.style.opacity='';pinStage.className='pin-stage';pin.style.cssText='';brand.className='final-brand';brand.style.opacity='';start.style.opacity='';fillMatrix();resize();networkStart=performance.now();raf=requestAnimationFrame(networkFrame);at(9800,overload);const seq=[[11700,LINES[0]],[14100,LINES[1]],[15800,LINES[2]],[17400,LINES[3]],[19200,LINES[4]],[21500,LINES[5],true]];seq.forEach(([t,text,fin],i)=>{at(t,()=>{hideCopy();at(300,()=>copy(text,fin))});if(i<seq.length-1)at(t+1600,hideCopy)});at(23350,flyLetters);at(24500,pinSequence)}
function runClosing(){clear();film.classList.add('close-mode');matrix.style.opacity='0';hero.style.opacity='0';pinStage.classList.add('on');pin.style.left='50%';pin.style.top='50%';pin.style.transform='translate(-50%,-50%) scale(.34)';pin.style.opacity='1';brand.classList.add('on');brand.style.opacity='1';cadStart=performance.now();raf=requestAnimationFrame(cadFrame);at(2750,()=>{if(embedded&&parent!==window)parent.postMessage({type:'sami:close-ready'},location.origin);else{try{window.close()}catch{}}})}

if(closing)runClosing();else run();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
